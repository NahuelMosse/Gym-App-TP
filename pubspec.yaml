dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: 9.1.1
  dartz: 0.10.1
  dio: 5.9.0
  flutter_dotenv: 6.0.0
  shared_preferences: 2.5.3
